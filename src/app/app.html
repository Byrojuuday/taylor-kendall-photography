<a class="skip" href="#content">Skip to content</a>

<div class="shell">
  <header class="nav">
    <div class="nav__brand">
      <app-logo />
    </div>
    <button
      type="button"
      class="nav-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? 'Close' : 'Menu' }}
    </button>
    <nav id="primary-nav" class="nav__links" [class.is-open]="menuOpen()" aria-label="Primary">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/work" routerLinkActive="is-active">Work</a>
      <a routerLink="/pricing" routerLinkActive="is-active">Pricing</a>
      <a routerLink="/about" routerLinkActive="is-active">About</a>
      <a routerLink="/contact" routerLinkActive="is-active">Contact</a>
    </nav>
  </header>

  <div class="rails" aria-hidden="true">
    <span class="rail rail--booking">Booking 2027</span>
    <span class="rail rail--name">Taylor Kendall Film &amp; Digital</span>
  </div>

  <div class="shell__main">
    <main id="content">
      <router-outlet />
    </main>
    <footer class="site-footer">
      <p>© 2026 Kendall Photo and Film</p>
      <p>2027 booking open</p>
      <a [href]="instagram" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="btn btn--solid" routerLink="/contact">Book your wedding</a>
    </footer>
  </div>
</div>
